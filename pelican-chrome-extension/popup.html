<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>鹈鹕模型鉴定器</title>
  <style>
    :root {
      --ink: #1f2a37;
      --ink-soft: #526275;
      --muted: #7c8b9c;
      --line: rgba(100, 116, 139, 0.16);
      --line-strong: rgba(100, 116, 139, 0.26);
      --open-ink: #1c624c;
      --open-bg: rgba(16, 185, 129, 0.14);
      --closed-ink: #384e66;
      --closed-bg: rgba(79, 109, 138, 0.13);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 374px;
      min-height: 455px;
      max-height: 600px;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: #f3f6fa;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
    }
    .brand { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .brand-mark {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: linear-gradient(145deg, #334354, #51657a);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 11.5px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .brand-title { font-size: 12.2px; font-weight: 750; white-space: nowrap; }
    .meta-chip {
      font-size: 9.8px;
      font-weight: 600;
      color: var(--ink-soft);
      background: #f1f5f9;
      border: 1px solid var(--line);
      padding: 1px 5.5px;
      border-radius: 999px;
      max-width: 96px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .top-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .sm-btn {
      appearance: none;
      border: 1px solid var(--line-strong);
      background: #ffffff;
      color: var(--ink);
      font-size: 10.6px;
      font-weight: 680;
      padding: 3.5px 6.5px;
      border-radius: 7px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .sm-btn:hover { background: #f8fafc; }
    .sm-btn.primary { background: #2b3b4e; color: #fff; border-color: #2b3b4e; }
    .sm-btn.scan { background: #eef4fb; color: #1e4b7a; border-color: rgba(36, 70, 107, 0.3); }

    .nav-tabs {
      display: flex;
      padding: 4px 10px 0;
      gap: 3px;
      background: rgba(255, 255, 255, 0.65);
      border-bottom: 1px solid var(--line);
    }
    .nav-tab {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--ink-soft);
      font-size: 11.3px;
      font-weight: 680;
      padding: 5.5px 10px;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-family: inherit;
    }
    .nav-tab.active { color: var(--ink); border-bottom-color: #2b3b4e; }

    .view {
      display: none;
      padding: 9px 11px 11px;
      overflow-y: auto;
      flex: 1;
      flex-direction: column;
      gap: 8px;
    }
    .view.active { display: flex; }

    .specimens-bar {
      display: none;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 1px;
      scrollbar-width: none;
    }
    .specimens-bar.show { display: flex; }
    .specimens-bar::-webkit-scrollbar { display: none; }
    .spec-tab {
      appearance: none;
      border: 1px solid var(--line-strong);
      background: #ffffff;
      color: var(--ink-soft);
      font-size: 10.2px;
      font-weight: 680;
      padding: 3px 7.5px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      flex-shrink: 0;
    }
    .spec-tab.active { background: #24466b; color: #ffffff; border-color: #24466b; }

    .preview-stage-wrap {
      position: relative;
      border-radius: 11px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      background: #f8fafc;
      aspect-ratio: 16 / 10;
      flex-shrink: 0;
    }
    .svg-fallback-stage {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      z-index: 1;
      padding: 6px;
    }
    .svg-fallback-stage svg {
      width: 94% !important;
      height: 94% !important;
      max-width: 94% !important;
      max-height: 94% !important;
      display: block;
    }
    .preview-stage-wrap iframe {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #f8fafc;
    }
    .stage-corner-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 5;
      appearance: none;
      border: 1px solid rgba(255,255,255,0.9);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      color: var(--ink-soft);
      font-size: 10px;
      font-weight: 650;
      padding: 2.5px 6.5px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
    }

    .pill-group {
      display: flex;
      gap: 2px;
      background: rgba(219, 227, 237, 0.72);
      padding: 2.5px;
      border-radius: 9px;
    }
    .source-pill-btn {
      flex: 1;
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 680;
      padding: 4px 6px;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-family: inherit;
    }
    .source-pill-btn.active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(15,26,40,0.08); }
    .source-pill-btn.active[data-filter="open"] { background: #226650; color: #fff; }
    .source-pill-btn.active[data-filter="closed"] { background: #364b63; color: #fff; }
    .pill-pct { font-size: 9.8px; opacity: 0.78; }

    .verdict-card {
      border-radius: 12px;
      padding: 10px 11px;
      background: #ffffff;
      border: 1px solid var(--line-strong);
    }
    .verdict-card.rarity-gold {
      background: linear-gradient(135deg, #fffcf2 0%, #f9efd8 100%);
      border-color: rgba(196, 149, 69, 0.52);
    }
    .verdict-card.rarity-silver {
      background: linear-gradient(135deg, #f9fbff 0%, #eaeff7 100%);
      border-color: rgba(132, 152, 175, 0.54);
    }
    .verdict-main { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .verdict-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .logo-box {
      width: 35px;
      height: 35px;
      border-radius: 9px;
      background: #f8fafc;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .model-title {
      font-size: 14.2px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge-row { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
    .tag { font-size: 9.8px; font-weight: 700; padding: 1px 5.5px; border-radius: 5px; }
    .tag.open { background: var(--open-bg); color: var(--open-ink); }
    .tag.closed { background: var(--closed-bg); color: var(--closed-ink); }
    .tag.tier { background: rgba(31,42,55,0.08); color: var(--ink); }
    .tag.gold { background: rgba(196,149,69,0.2); color: #7c581c; }
    .tag.silver { background: rgba(120,139,161,0.2); color: #3d4f63; }
    .tag.ingested { background: rgba(16,185,129,0.18); color: #0f5c41; }
    .tag.kw { background: rgba(245, 158, 11, 0.16); color: #92400e; }
    .tag.open-thinking { background: rgba(16, 185, 129, 0.22); color: #065f46; border: 1px solid rgba(16, 185, 129, 0.45); font-weight: 800; }
    .conf-num { font-size: 18px; font-weight: 850; flex-shrink: 0; }

    .verdict-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
    }
    .act-btn {
      appearance: none;
      border: 1px solid var(--line-strong);
      background: #f8fafc;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 680;
      padding: 4px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-family: inherit;
    }
    .act-btn.correct-btn { color: #1e4b7a; border-color: rgba(43,76,111,0.3); background: rgba(235,243,252,0.65); }
    .act-btn.active { background: #24466b; color: #fff; border-color: #24466b; }

    .toast-inline {
      display: none;
      font-size: 11px;
      font-weight: 650;
      padding: 6px 9px;
      border-radius: 8px;
      background: rgba(16,185,129,0.13);
      border: 1px solid rgba(16,150,108,0.3);
      color: #0f5c41;
    }
    .toast-inline.err { background: rgba(239,68,68,0.11); border-color: rgba(220,38,38,0.28); color: #991b1b; }
    .toast-inline.show { display: block; }

    .drawer-card {
      display: none;
      border-radius: 11px;
      padding: 9px 10px;
      background: #ffffff;
      border: 1px solid var(--line-strong);
      flex-direction: column;
      gap: 7px;
    }
    .drawer-card.open { display: flex; }
    .drawer-lbl { font-size: 10.2px; font-weight: 700; color: var(--muted); display: flex; justify-content: space-between; }

    .chip-scroll { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .chip-scroll::-webkit-scrollbar { display: none; }
    .quick-chip {
      appearance: none;
      border: 1px solid var(--line);
      background: #f4f7fa;
      color: var(--ink);
      font-size: 10.3px;
      font-weight: 650;
      padding: 2.5px 7px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      flex-shrink: 0;
    }
    .quick-chip.sel { background: #24466b; color: #fff; border-color: #24466b; }
    .form-grid-2 { display: grid; grid-template-columns: 104px 1fr; gap: 6px; }
    .inp-ctrl {
      width: 100%;
      padding: 5px 7px;
      border-radius: 7px;
      border: 1px solid var(--line-strong);
      background: #f9fbfd;
      color: var(--ink);
      font-size: 11.3px;
      font-weight: 650;
      font-family: inherit;
    }
    .corr-bottom-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .tier-pick-group { display: flex; gap: 3px; background: #eef2f7; padding: 2px; border-radius: 7px; flex: 1; }
    .tier-pick-btn {
      flex: 1;
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--ink-soft);
      font-size: 10px;
      font-weight: 750;
      padding: 4px 2px;
      border-radius: 5px;
      cursor: pointer;
    }
    .tier-pick-btn.active { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(15,26,40,0.1); }
    .submit-ingest-btn {
      appearance: none;
      border: 0;
      background: #1f5f4b;
      color: #fff;
      font-size: 11.2px;
      font-weight: 720;
      padding: 5.5px 11px;
      border-radius: 7px;
      cursor: pointer;
      font-family: inherit;
    }

    .tier-mini-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .tier-mini-cell { text-align: center; padding: 3.5px 2px; border-radius: 6px; background: #f4f7fa; border: 1px solid var(--line); font-size: 10px; color: var(--ink-soft); }
    .tier-mini-cell.active { background: #eef4fb; border-color: rgba(59,107,156,0.45); color: var(--ink); font-weight: 750; }
    .cand-row { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 6px; padding: 3px 2px; cursor: pointer; }
    .cand-name { font-size: 11px; font-weight: 650; }
    .prob-track { height: 4px; border-radius: 999px; background: #e6ecf3; overflow: hidden; margin-top: 2px; }
    .prob-fill { height: 100%; border-radius: 999px; background: #5a738e; }
    .cand-pct { font-size: 10.5px; font-weight: 700; color: var(--ink-soft); }
    .vlogo { display: inline-grid; place-items: center; }

    .empty-box {
      padding: 30px 14px;
      text-align: center;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.6;
      background: #ffffff;
      border-radius: 12px;
      border: 1px dashed var(--line-strong);
    }

    textarea.paste-box {
      width: 100%;
      height: 170px;
      resize: vertical;
      border-radius: 10px;
      border: 1px solid var(--line-strong);
      padding: 9px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.2px;
      background: #fff;
      color: var(--ink);
    }
    .field { margin-bottom: 9px; }
    .field label { display: block; font-size: 11.2px; font-weight: 680; margin-bottom: 4px; color: var(--ink); }
    .field input[type="text"], .field input[type="password"], .field textarea {
      width: 100%;
      padding: 6.5px 9px;
      border-radius: 8px;
      border: 1px solid var(--line-strong);
      font-size: 11.8px;
      background: #fff;
      font-family: inherit;
    }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: #fff;
      border-radius: 9px;
      border: 1px solid var(--line);
      margin-bottom: 7px;
      font-size: 11.6px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">鹈</div>
      <div class="brand-title">鹈鹕鉴定</div>
      <span class="meta-chip" id="statusSub">就绪</span>
    </div>
    <div class="top-actions">
      <button class="sm-btn scan" id="btnScanTab" type="button" title="扫描当前标签页中的 SVG / HTML 代码">🔍 抓本页</button>
      <button class="sm-btn primary" id="btnCheckClip" type="button">📋 剪贴板</button>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab active" data-tab="result" type="button">鉴定与入库</button>
    <button class="nav-tab" data-tab="paste" type="button">手动粘贴</button>
    <button class="nav-tab" data-tab="settings" type="button">⚙ 设置</button>
  </div>

  <!-- Tab 1: Result -->
  <div class="view active" id="view-result">
    <div id="emptyState" class="empty-box">
      网页出现鹈鹕、大嘴鸟、白鸽、摩托车等 SVG/HTML 绘图代码将自动触发识别；<br/>
      也可点击右上角 <strong>🔍 抓本页</strong> 或 <strong>📋 剪贴板</strong> 立即鉴定。
    </div>

    <div id="resultContent" style="display:none;flex-direction:column;gap:8px;">
      <div class="specimens-bar" id="pageSpecimensBar"></div>

      <div class="preview-stage-wrap">
        <div class="svg-fallback-stage" id="svgFallbackStage"></div>
        <iframe id="popupPreviewFrame" title="预览"></iframe>
        <button class="stage-corner-btn" id="btnPopInTab" type="button">⤢ 网页浮窗</button>
      </div>

      <div class="pill-group">
        <button class="source-pill-btn active" data-filter="all" type="button"><span>全部</span><span class="pill-pct" id="pctAll"></span></button>
        <button class="source-pill-btn" data-filter="open" type="button"><span>开源</span><span class="pill-pct" id="pctOpen">--%</span></button>
        <button class="source-pill-btn" data-filter="closed" type="button"><span>闭源</span><span class="pill-pct" id="pctClosed">--%</span></button>
      </div>

      <div class="verdict-card" id="verdictCard">
        <div class="verdict-main">
          <div class="verdict-left">
            <div class="logo-box" id="heroLogo"></div>
            <div style="min-width:0;">
              <div class="model-title" id="heroTitle">--</div>
              <div class="badge-row" id="heroBadges"></div>
            </div>
          </div>
          <div class="conf-num" id="confPct">--%</div>
        </div>
        <div class="verdict-actions">
          <button class="act-btn correct-btn" id="btnToggleCorrect" type="button">✎ 纠正 / 入库</button>
          <button class="act-btn" id="btnToggleDetails" type="button">详情 ▾</button>
        </div>
      </div>

      <div class="toast-inline" id="inlineToast"></div>

      <div class="drawer-card" id="correctDrawer">
        <div class="drawer-lbl">
          <span>点选候选或指定真实模型入库</span>
          <span id="corrModeHint" style="color:#1f5f4b;">归档入库</span>
        </div>
        <div class="chip-scroll" id="candidateQuickChips"></div>
        <div class="form-grid-2">
          <select class="inp-ctrl" id="corrVendorSelect"></select>
          <input class="inp-ctrl" id="corrModelInput" type="text" placeholder="型号，如 opus-5.5" />
        </div>
        <div class="chip-scroll" id="vendorModelChips"></div>
        <div class="corr-bottom-row">
          <div class="tier-pick-group" id="corrTierGroup">
            <button type="button" class="tier-pick-btn" data-tier="low">LOW</button>
            <button type="button" class="tier-pick-btn" data-tier="medium">MED</button>
            <button type="button" class="tier-pick-btn active" data-tier="high">HIGH</button>
            <button type="button" class="tier-pick-btn" data-tier="max">MAX</button>
          </div>
          <button type="button" class="submit-ingest-btn" id="btnSubmitIngest">确认入库</button>
        </div>
      </div>

      <div class="drawer-card" id="detailsDrawer">
        <div class="drawer-lbl"><span>推理强度分布</span><span id="effortSummaryLbl">--</span></div>
        <div class="tier-mini-bar" id="tierGrid"></div>
        <div class="drawer-lbl" style="margin-top:3px;"><span id="candTitle">Top-5 候选</span><span>点击填入纠错</span></div>
        <div id="candBars"></div>
      </div>
    </div>
  </div>

  <!-- Tab 2: Paste -->
  <div class="view" id="view-paste">
    <textarea class="paste-box" id="pasteInput" placeholder="在此粘贴 <!DOCTYPE html>... 或 <svg ...>...</svg> 源码..."></textarea>
    <div style="display:flex;justify-content:flex-end;gap:6px;">
      <button class="sm-btn" id="btnClearPaste" type="button">清空</button>
      <button class="sm-btn primary" id="btnRunPaste" type="button">立即渲染并鉴定</button>
    </div>
  </div>

  <!-- Tab 3: Settings -->
  <div class="view" id="view-settings">
    <div class="switch-row">
      <span><strong>自动捕获网页 SVG/HTML 绘图代码</strong></span>
      <input type="checkbox" id="cfgAutoPageCapture" checked />
    </div>
    <div class="switch-row">
      <span>仅限命中<strong>关键词特征</strong>才自动弹出（默认关闭=全捕获）</span>
      <input type="checkbox" id="cfgKeywordOnlyAuto" />
    </div>
    <div class="switch-row">
      <span>复制代码时自动弹出网页鉴定窗</span>
      <input type="checkbox" id="cfgAutoPopup" checked />
    </div>
    <div class="field">
      <label style="display:flex;justify-content:space-between;align-items:center;">
        <span>关键词特征词库（逗号分隔，中英文大小写不敏感）</span>
        <button class="quick-chip" id="btnResetDefaultKws" type="button">恢复默认</button>
      </label>
      <textarea id="cfgCaptureKeywords" rows="3" spellcheck="false"></textarea>
    </div>
    <div class="field">
      <label>后端服务地址 (API Base)</label>
      <input type="text" id="cfgApiBase" placeholder="https://th.629717.cc.cd" />
    </div>
    <div class="field">
      <label>访问与入库密钥 (API Key)</label>
      <input type="password" id="cfgApiKey" placeholder="1234567890" />
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <button class="sm-btn primary" id="btnSaveCfg" type="button">保存设置</button>
      <span id="saveToast" style="font-size:11.5px;color:#1c624c;"></span>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
