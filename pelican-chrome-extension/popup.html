<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>鹈鹕实验室 · 剪贴板模型鉴定</title>
  <style>
    :root {
      --bg-base: #edf0f5;
      --ink: #25303d;
      --ink-soft: #506072;
      --muted: #7a8899;
      --glass-hairline: rgba(100, 116, 139, 0.15);
      --glass-hairline-strong: rgba(100, 116, 139, 0.25);
      --gold-border: rgba(196, 149, 69, 0.56);
      --gold-bg: linear-gradient(135deg, rgba(255, 251, 240, 0.96) 0%, rgba(246, 234, 204, 0.86) 52%, rgba(255, 250, 238, 0.95) 100%);
      --gold-glow: 0 10px 28px rgba(188, 140, 58, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.94);
      --silver-border: rgba(132, 152, 175, 0.58);
      --silver-bg: linear-gradient(135deg, rgba(248, 251, 255, 0.96) 0%, rgba(226, 234, 244, 0.88) 52%, rgba(246, 249, 253, 0.95) 100%);
      --silver-glow: 0 10px 26px rgba(96, 118, 144, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.96);
      --open-ink: #1f5f4b;
      --open-bg: rgba(16, 185, 129, 0.14);
      --open-border: rgba(16, 150, 108, 0.34);
      --open-pill-active: linear-gradient(135deg, #276e59, #1e5645);
      --closed-ink: #384d66;
      --closed-bg: rgba(79, 109, 138, 0.13);
      --closed-border: rgba(79, 109, 138, 0.32);
      --closed-pill-active: linear-gradient(135deg, #3c526b, #2c3e52);
    }

    * { box-sizing: border-box; }

    body {
      width: 400px;
      margin: 0;
      padding: 0;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 12% 10%, rgba(164, 182, 200, 0.28) 0%, transparent 48%),
        radial-gradient(circle at 88% 15%, rgba(206, 190, 162, 0.22) 0%, transparent 45%),
        linear-gradient(180deg, #f2f5f9 0%, #e7ecf2 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .popup-header {
      padding: 11px 14px;
      background: rgba(245, 248, 252, 0.88);
      border-bottom: 1px solid rgba(255, 255, 255, 0.88);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-mark {
      width: 27px;
      height: 27px;
      border-radius: 8px;
      background: linear-gradient(145deg, #3b4a5b, #56697e);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 2px 7px rgba(45, 58, 74, 0.18);
    }
    .brand-title { font-size: 13.5px; font-weight: 760; color: var(--ink); }
    .meta-chip {
      font-size: 10.2px;
      font-weight: 650;
      color: var(--ink-soft);
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--glass-hairline);
      padding: 1.5px 7px;
      border-radius: 999px;
    }

    .head-actions { display: flex; align-items: center; gap: 5px; }
    .mini-action-btn {
      appearance: none;
      border: 1px solid var(--glass-hairline-strong);
      background: rgba(255, 255, 255, 0.84);
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 650;
      padding: 4px 8.5px;
      border-radius: 7px;
      cursor: pointer;
      font-family: inherit;
    }
    .mini-action-btn:hover { background: #ffffff; color: var(--ink); }
    .mini-action-btn.primary { background: #364556; border-color: #364556; color: #ffffff; }

    .source-pill-bar { padding: 9px 14px 7px; }
    .pill-group {
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(220, 228, 237, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.88);
      padding: 3px;
      border-radius: 999px;
    }
    .source-pill-btn {
      flex: 1;
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--ink-soft);
      font-size: 11.6px;
      font-weight: 720;
      padding: 5px 8px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-family: inherit;
    }
    .source-pill-btn.active[data-filter="all"] {
      background: #ffffff;
      color: var(--ink);
      box-shadow: 0 2px 7px rgba(31, 43, 58, 0.09);
    }
    .source-pill-btn.active[data-filter="open"] {
      background: var(--open-pill-active);
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(31, 95, 75, 0.25);
    }
    .source-pill-btn.active[data-filter="closed"] {
      background: var(--closed-pill-active);
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(44, 62, 82, 0.24);
    }
    .pill-pct {
      font-size: 10px;
      font-weight: 650;
      opacity: 0.8;
      padding: 0.5px 5px;
      border-radius: 999px;
      background: rgba(100, 116, 139, 0.12);
    }
    .source-pill-btn.active .pill-pct { background: rgba(255, 255, 255, 0.22); color: inherit; opacity: 0.96; }

    .popup-main { padding: 0 14px 14px; }

    /* Collapsible Drawers (Paste Input & Settings) */
    .drawer-box {
      display: none;
      margin-bottom: 10px;
      padding: 10px 11px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid var(--glass-hairline-strong);
    }
    .drawer-box.open { display: block; }

    .code-area {
      width: 100%;
      height: 82px;
      resize: vertical;
      border-radius: 8px;
      border: 1px solid var(--glass-hairline-strong);
      padding: 7px 9px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: var(--ink);
      outline: none;
      margin-bottom: 7px;
    }

    .cfg-row { margin-bottom: 8px; }
    .cfg-row label { display: block; font-size: 11px; font-weight: 650; color: var(--ink-soft); margin-bottom: 3px; }
    .cfg-inp {
      width: 100%;
      padding: 6px 9px;
      border-radius: 8px;
      border: 1px solid var(--glass-hairline-strong);
      font-size: 12px;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Preview Stage + Model Annotation */
    .preview-stage-wrap {
      position: relative;
      border-radius: 13px;
      overflow: hidden;
      border: 1px solid var(--glass-hairline-strong);
      background: #f6f8fb;
      aspect-ratio: 16 / 10;
    }
    .preview-stage-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #ffffff;
    }
    .preview-top-actions {
      position: absolute;
      top: 7px;
      right: 7px;
      display: flex;
      gap: 4px;
      z-index: 5;
    }
    .stage-mini-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.88);
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(10px);
      color: var(--ink-soft);
      font-size: 10.2px;
      font-weight: 650;
      padding: 2.5px 7px;
      border-radius: 7px;
      cursor: pointer;
    }
    .preview-model-annot {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 5.5px 9px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 6px 16px rgba(24, 36, 52, 0.12);
    }
    .preview-model-annot.annot-gold {
      background: linear-gradient(135deg, rgba(255, 251, 240, 0.94), rgba(248, 237, 210, 0.9));
      border-color: rgba(196, 149, 69, 0.56);
    }
    .preview-model-annot.annot-silver {
      background: linear-gradient(135deg, rgba(248, 251, 255, 0.95), rgba(230, 238, 247, 0.9));
      border-color: rgba(132, 152, 175, 0.56);
    }
    .annot-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .annot-model-name { font-size: 12px; font-weight: 780; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .annot-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

    .micro-badge { font-size: 9.8px; font-weight: 750; padding: 1.5px 5.5px; border-radius: 999px; white-space: nowrap; }
    .micro-badge.open { background: var(--open-bg); color: var(--open-ink); border: 1px solid var(--open-border); }
    .micro-badge.closed { background: var(--closed-bg); color: var(--closed-ink); border: 1px solid var(--closed-border); }
    .micro-badge.tier { background: rgba(54, 69, 86, 0.11); color: var(--ink); text-transform: uppercase; }
    .micro-badge.conf { background: #364556; color: #ffffff; }

    @keyframes foilSweep {
      0% { transform: translateX(-130%) skewX(-22deg); }
      100% { transform: translateX(230%) skewX(-22deg); }
    }
    .gacha-hero {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      padding: 11px 12px;
      margin-top: 9px;
      border: 1px solid var(--glass-hairline-strong);
      background: rgba(255, 255, 255, 0.8);
    }
    .gacha-hero::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 48%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.62), transparent);
      transform: translateX(-140%) skewX(-22deg);
      pointer-events: none;
    }
    .gacha-hero.rarity-gold { background: var(--gold-bg); border: 1.5px solid var(--gold-border); box-shadow: var(--gold-glow); }
    .gacha-hero.rarity-gold::after { animation: foilSweep 1.15s cubic-bezier(0.22, 1, 0.36, 1) 1; }
    .gacha-hero.rarity-silver { background: var(--silver-bg); border: 1.5px solid var(--silver-border); box-shadow: var(--silver-glow); }
    .gacha-hero.rarity-silver::after { animation: foilSweep 1.15s cubic-bezier(0.22, 1, 0.36, 1) 1; }

    .gacha-top-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 7px; }
    .rarity-pill { font-size: 10.2px; font-weight: 750; padding: 2px 8.5px; border-radius: 999px; background: rgba(100, 116, 139, 0.14); color: var(--ink-soft); }
    .rarity-gold .rarity-pill { background: linear-gradient(135deg, #c99a49, #ad7e2f); color: #fffdf8; }
    .rarity-silver .rarity-pill { background: linear-gradient(135deg, #7d92a8, #5e7389); color: #f8fafc; }
    .archive-hit-tag { font-size: 10px; font-weight: 650; color: var(--ink-soft); background: rgba(255, 255, 255, 0.78); border: 1px solid rgba(100, 116, 139, 0.18); padding: 1.5px 7.5px; border-radius: 999px; }

    .gacha-main-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .gacha-identity { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .gacha-logo-frame { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(100, 116, 139, 0.16); flex-shrink: 0; }
    .gacha-model-name { font-size: 16.5px; font-weight: 800; color: var(--ink); line-height: 1.2; }
    .rarity-gold .gacha-model-name { color: #463210; }
    .gacha-model-sub { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

    .conf-ring-wrap { position: relative; width: 48px; height: 48px; flex-shrink: 0; display: grid; place-items: center; }
    .conf-ring-pct { position: absolute; font-size: 11px; font-weight: 800; color: var(--ink); }

    .filter-notice {
      margin-top: 7px;
      padding: 5.5px 8px;
      border-radius: 8px;
      font-size: 10.6px;
      background: rgba(245, 158, 11, 0.13);
      border: 1px solid rgba(217, 119, 6, 0.28);
      color: #92400e;
      display: none;
    }

    .vis-block {
      margin-top: 8px;
      padding: 9px 11px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.66);
      border: 1px solid var(--glass-hairline);
    }
    .vis-head { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
    .tier-segments { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .tier-seg { border-radius: 8px; padding: 4.5px 4px; text-align: center; background: rgba(255, 255, 255, 0.65); border: 1px solid var(--glass-hairline); }
    .tier-seg.active { background: #ffffff; border-color: rgba(79, 109, 138, 0.55); box-shadow: 0 2px 8px rgba(54, 69, 86, 0.08); }
    .tier-seg-label { font-size: 9.6px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
    .tier-seg.active .tier-seg-label { color: var(--ink); }
    .tier-seg-val { font-size: 11.5px; font-weight: 750; color: var(--ink); }

    .cand-row { display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 7px; padding: 3.5px 0; }
    .cand-name-line { display: flex; align-items: center; gap: 4px; font-size: 11.2px; font-weight: 660; color: var(--ink); margin-bottom: 2.5px; flex-wrap: wrap; }
    .mini-rank-tag { font-size: 9.2px; font-weight: 750; padding: 0.5px 4.5px; border-radius: 4px; }
    .mini-rank-tag.gold { background: rgba(196, 149, 69, 0.18); color: #7d5b22; }
    .mini-rank-tag.silver { background: rgba(122, 143, 166, 0.18); color: #3d4f63; }
    .mini-rank-tag.open { background: var(--open-bg); color: var(--open-ink); }
    .mini-rank-tag.closed { background: rgba(100, 116, 139, 0.12); color: var(--ink-soft); }
    .prob-track { height: 5px; border-radius: 999px; background: rgba(148, 163, 184, 0.18); overflow: hidden; }
    .prob-fill { height: 100%; border-radius: 999px; transition: width 0.25s ease; }
    .cand-pct { font-size: 11px; font-weight: 720; color: var(--ink-soft); min-width: 38px; text-align: right; }
    .vlogo { display: inline-grid; place-items: center; flex-shrink: 0; }

    .history-strip { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
    .hist-chip {
      appearance: none;
      border: 1px solid var(--glass-hairline);
      background: rgba(255, 255, 255, 0.82);
      border-radius: 999px;
      padding: 3px 8px 3px 5px;
      font-size: 10.8px;
      font-weight: 650;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      font-family: inherit;
    }
    .hist-chip:hover { background: #ffffff; }
  </style>
</head>
<body>
  <header class="popup-header">
    <div class="brand">
      <div class="brand-mark">鹈</div>
      <span class="brand-title">鹈鹕剪贴板鉴定</span>
      <span class="meta-chip" id="formatChip">就绪</span>
    </div>
    <div class="head-actions">
      <button class="mini-action-btn" id="btnRefreshPopupClip" type="button" title="强制重新读取当前最新剪贴板">↻ 剪贴板</button>
      <button class="mini-action-btn" id="btnTogglePaste" type="button">粘贴源码</button>
      <button class="mini-action-btn" id="btnToggleSettings" type="button" title="连接地址与密钥设置">⚙</button>
    </div>
  </header>

  <div class="source-pill-bar">
    <div class="pill-group">
      <button class="source-pill-btn active" data-filter="all" type="button">
        <span>全部模型</span>
        <span class="pill-pct" id="pctAll">--</span>
      </button>
      <button class="source-pill-btn" data-filter="open" type="button" title="仅筛选开源模型（再次点击恢复全部）">
        <span>开源</span>
        <span class="pill-pct" id="pctOpen">--%</span>
      </button>
      <button class="source-pill-btn" data-filter="closed" type="button" title="仅筛选闭源商业模型（再次点击恢复全部）">
        <span>闭源</span>
        <span class="pill-pct" id="pctClosed">--%</span>
      </button>
    </div>
  </div>

  <main class="popup-main">
    <!-- Manual Paste Drawer -->
    <div class="drawer-box" id="pasteDrawer">
      <textarea class="code-area" id="manualCodeInput" spellcheck="false" placeholder="在此粘贴 <svg>...</svg> 或 <!DOCTYPE html>... 源码后点击立即鉴定..."></textarea>
      <div style="display:flex;justify-content:space-between;gap:6px;">
        <button class="mini-action-btn" id="btnReadClipNow" type="button">读取系统剪贴板</button>
        <button class="mini-action-btn primary" id="btnRunManualIdentify" type="button">立即鉴定</button>
      </div>
    </div>

    <!-- Settings Drawer (Pre-configured with th.629717.cc.cd & 1234567890) -->
    <div class="drawer-box" id="settingsDrawer">
      <div class="cfg-row">
        <label for="cfgApiBase">识别接口地址（默认固化）</label>
        <input class="cfg-inp" id="cfgApiBase" type="text" value="https://th.629717.cc.cd" />
      </div>
      <div class="cfg-row">
        <label for="cfgApiKey">访问密码 (X-API-Key，默认 1234567890)</label>
        <input class="cfg-inp" id="cfgApiKey" type="password" value="1234567890" />
      </div>
      <div class="cfg-row" style="display:flex;align-items:center;justify-content:space-between;">
        <label for="cfgAutoPopup" style="margin:0;cursor:pointer;">复制 SVG/HTML 时自动在网页弹出预览小窗</label>
        <input id="cfgAutoPopup" type="checkbox" checked />
      </div>
      <div style="display:flex;justify-content:space-between;gap:6px;margin-top:6px;">
        <button class="mini-action-btn" id="btnResetCfg" type="button">恢复默认</button>
        <button class="mini-action-btn primary" id="btnSaveCfg" type="button">保存配置</button>
      </div>
    </div>

    <!-- Sandbox Live Preview + Model Annotation -->
    <div class="preview-stage-wrap">
      <iframe id="popupPreviewFrame" title="预览"></iframe>
      <div class="preview-top-actions">
        <button class="stage-mini-btn" id="btnSendToPage" type="button" title="在当前网页右下角打开悬浮预览窗">网页悬浮窗 ↗</button>
      </div>
      <div class="preview-model-annot" id="annotBar" style="display:none;">
        <div class="annot-left">
          <span id="annotLogo"></span>
          <span class="annot-model-name" id="annotName">--</span>
        </div>
        <div class="annot-right">
          <span class="micro-badge closed" id="annotSrc">--</span>
          <span class="micro-badge tier" id="annotTier">--</span>
          <span class="micro-badge conf" id="annotConf">--%</span>
        </div>
      </div>
    </div>

    <!-- Gacha Verdict Card -->
    <div class="gacha-hero rarity-normal" id="verdictHero">
      <div class="gacha-top-row">
        <span class="rarity-pill" id="rarityPill">等待剪贴板 SVG / HTML</span>
        <div style="display:flex;gap:4px;align-items:center;">
          <span class="micro-badge closed" id="heroSrcTag" style="display:none;">--</span>
          <span class="archive-hit-tag" id="confBandTag">就绪</span>
        </div>
      </div>
      <div class="gacha-main-row">
        <div class="gacha-identity">
          <div class="gacha-logo-frame" id="heroLogo"></div>
          <div style="min-width:0;">
            <div class="gacha-model-name" id="heroTitle">复制任意 SVG / HTML</div>
            <div class="gacha-model-sub" id="heroSub">自动检测剪贴板并连接 th.629717.cc.cd 鉴定</div>
          </div>
        </div>
        <div class="conf-ring-wrap">
          <svg width="48" height="48" viewBox="0 0 54 54">
            <circle cx="27" cy="27" r="22" fill="none" stroke="rgba(148,163,184,0.22)" stroke-width="4.5"/>
            <circle id="confRing" cx="27" cy="27" r="22" fill="none" stroke="#4f6d8a" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="138.2" transform="rotate(-90 27 27)"/>
          </svg>
          <span class="conf-ring-pct" id="confPct">--</span>
        </div>
      </div>
      <div class="filter-notice" id="filterNotice"></div>
    </div>

    <!-- Effort Gauge -->
    <div class="vis-block">
      <div class="vis-head">
        <span>推理强度档位</span>
        <span id="effortHeadline" style="color:var(--ink);">--</span>
      </div>
      <div class="tier-segments" id="tierGrid"></div>
    </div>

    <!-- Top-5 Candidates -->
    <div class="vis-block">
      <div class="vis-head">
        <span id="candTitle">模型概率分布</span>
        <span id="candHint" style="font-weight:500;font-size:10.2px;color:var(--muted);">Top-5 候选</span>
      </div>
      <div id="candBars">
        <div style="font-size:11.2px;color:var(--muted);padding:4px 0;">复制页面上的 SVG 或 HTML 代码后，此处展示 Top-5 细分模型概率。</div>
      </div>
    </div>

    <!-- Recent Clipboard History -->
    <div class="vis-block">
      <div class="vis-head">
        <span>最近剪贴板鉴定记录</span>
        <span id="histCount" style="font-size:10.2px;color:var(--muted);">0 条</span>
      </div>
      <div class="history-strip" id="historyStrip">
        <span style="font-size:11px;color:var(--muted);">暂无历史记录</span>
      </div>
    </div>
  </main>
