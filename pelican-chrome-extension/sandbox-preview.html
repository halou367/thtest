<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Pelican Sandbox Preview</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
    }
    #stageHost {
      width: 100%;
      height: 100%;
      display: none;
      background: #ffffff;
    }
    #stageHost iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #ffffff;
    }
    .empty-hint {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #7a8899;
      background: #f6f8fb;
    }
  </style>
</head>
<body>
  <div id="emptyHint" class="empty-hint">等待剪贴板 SVG / HTML 预览...</div>
  <div id="stageHost"></div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search || "");
      const myCid = params.get("cid") || "default";

      const AUTOFIT_SNIPPET = `<style id="__tihu_fit_css">
html,body{margin:0;padding:0;scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;}
</style><script>(function(){
  function ensureSvgViewBox(s){
    if(!s.getAttribute("viewBox")){
      var w=parseFloat(s.getAttribute("width")),h=parseFloat(s.getAttribute("height"));
      if(!(w>0&&h>0)){
        try{var bb=s.getBBox();if(bb&&bb.width>0&&bb.height>0){s.setAttribute("viewBox",bb.x+" "+bb.y+" "+bb.width+" "+bb.height);return;}}catch(e){}
      }
      if(w>0&&h>0)s.setAttribute("viewBox","0 0 "+w+" "+h);
    }
  }
  var lastFitW=0,lastFitH=0;
  function fit(){
    try{
      var svgs=document.querySelectorAll("svg");
      svgs.forEach(ensureSvgViewBox);
      var b=document.body,d=document.documentElement;
      if(!b)return;
      var vw=window.innerWidth,vh=window.innerHeight;
      if(vw<20||vh<20)return;
      lastFitW=vw;lastFitH=vh;
      b.style.transform="";b.style.transformOrigin="";
      var visKids=[];
      for(var k=0;k<b.children.length;k++){
        var tag=b.children[k].tagName.toLowerCase();
        if(tag!=="script"&&tag!=="style"&&tag!=="link"&&tag!=="meta"&&tag!=="title")visKids.push(b.children[k]);
      }
      if(visKids.length===1&&visKids[0].tagName.toLowerCase()==="svg"){
        var onlySvg=visKids[0];
        ensureSvgViewBox(onlySvg);
        d.style.margin="0";d.style.padding="0";d.style.width="100%";d.style.height="100%";d.style.overflow="hidden";
        b.style.margin="0";b.style.padding="0";b.style.width="100vw";b.style.height="100vh";b.style.overflow="hidden";
        b.style.display="flex";b.style.alignItems="center";b.style.justifyContent="center";b.style.background="#ffffff";
        onlySvg.style.setProperty("display","block","important");
        onlySvg.style.setProperty("width","96vw","important");
        onlySvg.style.setProperty("height","96vh","important");
        onlySvg.style.setProperty("max-width","96vw","important");
        onlySvg.style.setProperty("max-height","96vh","important");
        return;
      }
      var sw=Math.max(d.scrollWidth,b.scrollWidth),sh=Math.max(d.scrollHeight,b.scrollHeight);
      var maxW=sw,maxH=sh;
      var media=b.querySelectorAll("svg,canvas");
      for(var m=0;m<media.length;m++){
        var mr=media[m].getBoundingClientRect();
        if(mr.width>100&&mr.right>maxW)maxW=mr.right;
        if(mr.height>100&&mr.bottom>maxH)maxH=mr.bottom;
      }
      if(maxW>vw*1.02||maxH>vh*1.02){
        var sc=Math.min(vw/maxW,vh/maxH)*0.96;
        d.style.overflow="hidden";b.style.overflow="hidden";
        b.style.transformOrigin="top left";
        b.style.transform="translate("+Math.max(0,(vw-maxW*sc)/2)+"px,"+Math.max(0,(vh-maxH*sc)/2)+"px) scale("+sc+")";
      }
    }catch(e){}
  }
  window.addEventListener("load",fit);
  window.addEventListener("resize",fit);
  if(typeof ResizeObserver!=="undefined"){
    try{
      new ResizeObserver(function(){
        var nw=window.innerWidth,nh=window.innerHeight;
        if(nw>=20&&nh>=20&&(Math.abs(nw-lastFitW)>2||Math.abs(nh-lastFitH)>2)){fit();}
      }).observe(document.documentElement);
    }catch(e){}
  }
  setTimeout(fit,40);
  setTimeout(fit,180);
  setTimeout(fit,450);
})();<\/script>`;

      function toSrcdoc(rawCode) {
        const trimmed = String(rawCode || "").trim();
        if (/^<!doctype\s+html/i.test(trimmed) || /<html[\s>]/i.test(trimmed)) {
          const lower = trimmed.toLowerCase();
          const bodyEnd = lower.lastIndexOf("</body>");
          if (bodyEnd !== -1) {
            return trimmed.slice(0, bodyEnd) + AUTOFIT_SNIPPET + trimmed.slice(bodyEnd);
          }
          const htmlEnd = lower.lastIndexOf("</html>");
          if (htmlEnd !== -1) {
            return trimmed.slice(0, htmlEnd) + AUTOFIT_SNIPPET + trimmed.slice(htmlEnd);
          }
          return trimmed + AUTOFIT_SNIPPET;
        }
        return "<!DOCTYPE html><html><head><meta charset=\"utf-8\">" + AUTOFIT_SNIPPET + "</head><body>" + trimmed + "</body></html>";
      }

      function notifyReady(cid) {
        try {
          window.parent.postMessage({ type: "PELICAN_SANDBOX_READY", cid: cid || myCid }, "*");
        } catch (_) {}
      }

      window.addEventListener("message", function (ev) {
        const d = ev && ev.data;
        if (!d || typeof d !== "object") return;

        if (d.type === "PELICAN_PING") {
          notifyReady(d.cid);
          return;
        }

        if (d.type !== "PELICAN_RENDER_CODE") return;

        const hint = document.getElementById("emptyHint");
        const host = document.getElementById("stageHost");

        if (!d.code) {
          host.style.display = "none";
          host.innerHTML = "";
          hint.style.display = "flex";
        } else {
          hint.style.display = "none";
          host.style.display = "block";
          // Always mount a fresh iframe so identical consecutive copies re-render cleanly from scratch!
          host.innerHTML = "";
          const freshFrame = document.createElement("iframe");
          freshFrame.setAttribute("scrolling", "no");
          freshFrame.srcdoc = toSrcdoc(d.code);
          host.appendChild(freshFrame);
        }

        try {
          window.parent.postMessage(
            {
              type: "PELICAN_RENDER_ACK",
              cid: d.cid || myCid,
              renderId: d.renderId || 0
            },
            "*"
          );
        } catch (_) {}
      });

      notifyReady();
    })();
  </script>
</body>
</html>
